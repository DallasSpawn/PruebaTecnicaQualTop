<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="ISO-8859-1">
        <title>Lista de tiendas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Qualtop</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                    <a class="nav-link " href="/clientes">Listado de Clientes</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link active" href="/tiendas">Listado de Tiendas</a>
                    </li>
                </ul>
                </div>
            </div>
            </nav>
        <div class="container">
            <div class="row">
                <div class="d-flex justify-content-start">
                    <H1>Listado de tiendas</H1>
                </div>
                <div class="d-flex justify-content-end">
                    <a href="/tiendas/nuevo">
                        <button type="button" class="btn btn-primary">
                        Nueva Tienda
                        </button>
                    </a>
                </div>
            </div>
            <table class="table">
                <thead>
                    <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Dirección</th>
                    <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tienda : ${tiendas}">
                        <td th:text="${tienda.id}"></td>
                        <td th:text="${tienda.nombre}"></td>
                        <td th:text="${tienda.direccion}"></td>
                        <td>
                            <a th:href="@{/tiendas/actualizar/{id}(id=${tienda.id})}" class="btn btn-info">Editar</a>
                            <a th:href="@{/tiendas/{id}(id=${tienda.id})}" class="btn btn-warning">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
