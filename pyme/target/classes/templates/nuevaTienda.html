<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="ISO-8859-1">
        <title>Nueva tienda</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Qualtop</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                    <a class="nav-link" href="/clientes">Listado de Clientes</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="/tiendas">Listado de Tiendas</a>
                    </li>
                </ul>
                </div>
            </div>
            </nav>
        <div class="container">
            <div class="row">
                <H1>Crear nueva tienda</H1>
            </div>
            <form th:action="@{/tiendas}" th:object="${tienda}" method="post">
                <div class="mb-3">
                    <label for="" class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" th:field="*{nombre}" required>
                    <div class="form-text">Máximo 50 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control" th:field="*{direccion}" required>
                    <div class="form-text">Máximo 255 caracteres.</div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </body>
</html>
